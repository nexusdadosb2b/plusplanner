<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Adicionado maximum-scale e user-scalable para evitar zoom em formulários no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Agência Planner</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos customizados -->
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Import Maps para carregar React e Firebase direto no navegador -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>

  <!-- Babel: Compila o JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { ChevronLeft, ChevronRight, Plus, Trash2, Calendar as CalendarIcon, Clock, Repeat, AlertCircle, X, Users, Briefcase, MapPin, DollarSign, Plane, User, Phone, Edit2, LayoutDashboard, TrendingUp, CreditCard, CalendarDays, CheckCircle2, Menu } from 'lucide-react';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc } from 'firebase/firestore';

    const myCustomFirebaseConfig = {
      apiKey: "AIzaSyCi6WmRrPBt9_5hRJsegqERHkzytqhM0hI",
      authDomain: "pluss-planner.firebaseapp.com",
      projectId: "pluss-planner",
      storageBucket: "pluss-planner.firebasestorage.app",
      messagingSenderId: "1017621824035",
      appId: "1:1017621824035:web:eabb474b2df676cd04a796"
    };

    let app, auth, db;

    try {
      app = initializeApp(myCustomFirebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.error("Erro ao inicializar Firebase:", e);
    }

    function PlannerApp() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDay, setSelectedDay] = useState(null);
      const [activeTab, setActiveTab] = useState('calendar'); 

      const [clients, setClients] = useState([]);
      const [isClientModalOpen, setIsClientModalOpen] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      
      const initialClientState = {
        name: '', type: 'EM PROSPECÇÃO', service: '', value: '', deadline: '',
        location: '', requiresTravel: false, responsible: '', status: 'Ativo',
        contact: '', notes: '', dueDate: '', 
        hasCommission: false, commissionTo: '', commissionPix: '', 
        isInstallment: false, remainingInstallments: 1 
      };
      const [clientForm, setClientForm] = useState(initialClientState);

      const [user, setUser] = useState(null);
      const [permanentActivities, setPermanentActivities] = useState([]);
      const [variableTasks, setVariableTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      
      // Inicia com o menu fechado no celular (largura < 768px) e aberto no PC
      const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 768);
      const [errorMsg, setErrorMsg] = useState("");
      
      const [newPermTitle, setNewPermTitle] = useState("");
      const [newPermDay, setNewPermDay] = useState("1");
      const [newPermTime, setNewPermTime] = useState("");
      const [newVarTitle, setNewVarTitle] = useState("");
      const [newVarTime, setNewVarTime] = useState("");
      const [newVarDuration, setNewVarDuration] = useState("1");
      const [modalTab, setModalTab] = useState('view');

      const daysOfWeek = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
      const daysOfWeekShort = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];

      useEffect(() => {
        if (!auth) return;
        const authenticate = async () => {
          try {
            await signInAnonymously(auth);
          } catch (err) {
            setErrorMsg(`Erro de Autenticação (${err.code}). Verifique os domínios autorizados no Firebase.`);
          }
        };

        authenticate();
        const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });

        // Ajusta sidebar se a tela for redimensionada
        const handleResize = () => {
          if (window.innerWidth > 768) setIsSidebarOpen(true);
          else setIsSidebarOpen(false);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          unsubscribeAuth();
          window.removeEventListener('resize', handleResize);
        }
      }, []);

      useEffect(() => {
        if (!user || !db) return;
        setLoading(true);

        const permRef = collection(db, 'agencia_workspace', 'main', 'permanent_activities');
        const varRef = collection(db, 'agencia_workspace', 'main', 'variable_tasks');
        const clientRef = collection(db, 'agencia_workspace', 'main', 'clients');

        const unsubPerm = onSnapshot(permRef, (snapshot) => {
          const perms = [];
          snapshot.forEach(doc => perms.push({ id: doc.id, ...doc.data() }));
          setPermanentActivities(perms);
        }, (err) => setErrorMsg("Erro leitura: " + err.code));

        const unsubVar = onSnapshot(varRef, (snapshot) => {
          const vars = [];
          snapshot.forEach(doc => vars.push({ id: doc.id, ...doc.data() }));
          setVariableTasks(vars);
          setLoading(false);
        }, (err) => setErrorMsg("Erro leitura: " + err.code));

        const unsubClients = onSnapshot(clientRef, (snapshot) => {
          const cls = [];
          snapshot.forEach(doc => cls.push({ id: doc.id, ...doc.data() }));
          setClients(cls);
        }, (err) => setErrorMsg("Erro leitura: " + err.code));

        return () => { unsubPerm(); unsubVar(); unsubClients(); };
      }, [user]);

      const handleAddPermanent = async (e) => {
        e.preventDefault();
        if (!newPermTitle || !newPermTime || !user) return;
        try {
          const permRef = collection(db, 'agencia_workspace', 'main', 'permanent_activities');
          await addDoc(permRef, { title: newPermTitle, dayOfWeek: parseInt(newPermDay), time: newPermTime, createdAt: new Date().toISOString() });
          setNewPermTitle(""); setNewPermTime("");
        } catch (err) { setErrorMsg("Erro ao salvar atividade permanente."); }
      };

      const handleAddVariable = async (e, dateString) => {
        e.preventDefault();
        if (!newVarTitle || !user) return;
        try {
          const start = new Date(dateString + 'T12:00:00');
          const end = new Date(start);
          end.setDate(end.getDate() + parseInt(newVarDuration || 1) - 1);
          const endDateString = formatDateString(end.getFullYear(), end.getMonth(), end.getDate());

          const varRef = collection(db, 'agencia_workspace', 'main', 'variable_tasks');
          await addDoc(varRef, { 
            title: newVarTitle, date: dateString, endDate: endDateString,
            duration: parseInt(newVarDuration || 1), time: newVarTime || null, 
            createdAt: new Date().toISOString() 
          });
          
          setNewVarTitle(""); setNewVarTime(""); setNewVarDuration("1"); setModalTab('view'); 
        } catch (err) { setErrorMsg("Erro ao salvar tarefa."); }
      };

      const handleDelete = async (id, type) => {
        if (!user) return;
        try {
          const collectionName = type === 'permanent' ? 'permanent_activities' : 'variable_tasks';
          await deleteDoc(doc(db, 'agencia_workspace', 'main', collectionName, id));
        } catch (err) { setErrorMsg("Erro ao excluir."); }
      };

      const handleSaveClient = async (e) => {
        e.preventDefault();
        if (!user) return;
        try {
          const dataToSave = { ...clientForm };
          if (!dataToSave.isInstallment) dataToSave.remainingInstallments = 1;
          if (!dataToSave.hasCommission) { dataToSave.commissionTo = ''; dataToSave.commissionPix = ''; }

          if (editingClient) {
            await updateDoc(doc(db, 'agencia_workspace', 'main', 'clients', editingClient.id), { ...dataToSave, updatedAt: new Date().toISOString() });
          } else {
            await addDoc(collection(db, 'agencia_workspace', 'main', 'clients'), { ...dataToSave, createdAt: new Date().toISOString() });
          }
          setIsClientModalOpen(false); setEditingClient(null); setClientForm(initialClientState);
        } catch (err) { setErrorMsg("Erro ao salvar cliente."); }
      };

      const openEditClient = (client) => { setEditingClient(client); setClientForm({ ...client }); setIsClientModalOpen(true); };
      const handleDeleteClient = async (id) => { if (user) await deleteDoc(doc(db, 'agencia_workspace', 'main', 'clients', id)); };

      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();
      const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));

      const year = currentDate.getFullYear(); const month = currentDate.getMonth();
      const daysCount = getDaysInMonth(year, month); const firstDay = getFirstDayOfMonth(year, month);
      const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const formatDateString = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      const parseCurrency = (valStr) => {
        if (!valStr) return 0;
        const cleanStr = valStr.toString().replace(/[^\d.,]/g, '');
        if (cleanStr.includes(',') && cleanStr.includes('.')) return parseFloat(cleanStr.replace(/\./g, '').replace(',', '.'));
        if (cleanStr.includes(',')) return parseFloat(cleanStr.replace(',', '.'));
        return parseFloat(cleanStr) || 0;
      };

      const generateFinanceProjections = () => {
        const months = [];
        const today = new Date();
        const currentM = today.getMonth(); const currentY = today.getFullYear();

        for(let i=0; i<4; i++) {
          const targetDate = new Date(currentY, currentM + i, 1);
          let monthTotal = 0; const monthItems = [];

          clients.forEach(client => {
            if (client.type === 'EM PROSPECÇÃO' || !client.value || !client.dueDate) return;
            const numValue = parseCurrency(client.value);
            if (numValue === 0) return;

            const clientDueDate = new Date(client.dueDate + 'T12:00:00');
            const diffMonths = (targetDate.getFullYear() - clientDueDate.getFullYear()) * 12 + (targetDate.getMonth() - clientDueDate.getMonth());

            let shouldInclude = false; let tag = '';

            if (client.type === 'PERIÓDICO') {
              if (diffMonths >= 0) { shouldInclude = true; tag = 'Recorrente'; }
            } else if (client.type === 'PONTUAL') {
              if (client.isInstallment && client.remainingInstallments > 0) {
                if (diffMonths >= 0 && diffMonths < client.remainingInstallments) {
                  shouldInclude = true; tag = `Parcela ${diffMonths + 1}/${client.remainingInstallments}`;
                }
              } else {
                if (diffMonths === 0) { shouldInclude = true; tag = 'Pagamento Único'; }
              }
            }

            if (shouldInclude) {
              monthTotal += numValue;
              const isLate = i === 0 && today.getDate() > clientDueDate.getDate();
              const isToday = i === 0 && today.getDate() === clientDueDate.getDate();
              monthItems.push({ ...client, tag, expectedDay: clientDueDate.getDate(), isLate, isToday, parsedValue: numValue });
            }
          });
          monthItems.sort((a, b) => a.expectedDay - b.expectedDay);
          months.push({ name: `${monthNames[targetDate.getMonth()]} ${targetDate.getFullYear()}`, items: monthItems, total: monthTotal, isCurrentMonth: i === 0 });
        }
        return months;
      };

      const financeData = generateFinanceProjections();

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-50">
          
          {/* Alertas de Erro Globais */}
          {errorMsg && (
            <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 sm:p-4 absolute top-2 sm:top-4 right-2 sm:right-4 left-2 sm:left-auto z-[70] rounded shadow-md flex items-center justify-between text-xs sm:text-sm">
              <div className="flex items-center"><AlertCircle className="w-4 h-4 sm:w-5 sm:h-5 mr-2 shrink-0"/> {errorMsg}</div>
              <button onClick={() => setErrorMsg("")} className="p-1"><X className="w-4 h-4 hover:text-red-900"/></button>
            </div>
          )}

          {/* Header Superior Responsivo */}
          <header className="bg-slate-900 text-white flex flex-col sm:flex-row items-center justify-between px-3 sm:px-4 py-2 sm:py-3 shrink-0 z-40 shadow-md gap-2 sm:gap-0">
            <div className="flex items-center justify-between w-full sm:w-auto">
              <h1 className="font-bold text-lg sm:text-xl tracking-tight flex items-center">
                <LayoutDashboard className="w-5 h-5 mr-2 text-indigo-400" /> Planner
              </h1>
            </div>
            <nav className="flex space-x-1 sm:space-x-2 bg-slate-800/50 p-1 rounded-lg w-full sm:w-auto overflow-x-auto hide-scrollbar">
              <button onClick={() => setActiveTab('calendar')} className={`flex-1 sm:flex-none flex items-center justify-center px-2 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'calendar' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}>
                <CalendarIcon className="w-3 h-3 sm:w-4 sm:h-4 mr-1 sm:mr-2" /> Calendário
              </button>
              <button onClick={() => setActiveTab('clients')} className={`flex-1 sm:flex-none flex items-center justify-center px-2 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'clients' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}>
                <Users className="w-3 h-3 sm:w-4 sm:h-4 mr-1 sm:mr-2" /> Clientes
              </button>
              <button onClick={() => setActiveTab('finance')} className={`flex-1 sm:flex-none flex items-center justify-center px-2 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'finance' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}>
                <TrendingUp className="w-3 h-3 sm:w-4 sm:h-4 mr-1 sm:mr-2" /> Financeiro
              </button>
            </nav>
          </header>

          <div className="flex-1 flex overflow-hidden relative">
            
            {/* --- ABA CALENDÁRIO --- */}
            {activeTab === 'calendar' && (
              <>
                {/* Overlay Escuro no Mobile para o Menu Lateral */}
                {isSidebarOpen && (
                  <div className="md:hidden absolute inset-0 bg-slate-900/60 z-20 backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)} />
                )}

                {/* Menu Lateral (Atividades Fixas) */}
                <div className={`${isSidebarOpen ? 'w-[85%] max-w-[320px] translate-x-0' : 'w-0 -translate-x-full md:translate-x-0'} absolute md:relative z-30 h-full transition-all duration-300 bg-white border-r border-slate-200 overflow-hidden flex flex-col shadow-2xl md:shadow-sm`}>
                  <div className="p-3 sm:p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                    <h2 className="font-bold text-slate-800 flex items-center text-sm sm:text-base"><Repeat className="w-4 h-4 mr-2 text-indigo-500" /> Atividades Fixas</h2>
                    <button className="md:hidden text-slate-400 hover:text-slate-700 p-1" onClick={() => setIsSidebarOpen(false)}><X className="w-5 h-5"/></button>
                  </div>
                  
                  <div className="p-3 sm:p-4 flex-1 overflow-y-auto">
                    <form onSubmit={handleAddPermanent} className="mb-4 sm:mb-6 bg-indigo-50/50 p-3 rounded-lg border border-indigo-100">
                      <input type="text" placeholder="Ex: Reunião de Pauta" className="w-full p-2 mb-2 text-xs sm:text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" value={newPermTitle} onChange={e => setNewPermTitle(e.target.value)} required />
                      <div className="flex gap-2 mb-2">
                        <select className="flex-1 p-2 text-xs sm:text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white" value={newPermDay} onChange={e => setNewPermDay(e.target.value)}>
                          {daysOfWeek.map((day, idx) => (<option key={idx} value={idx}>{day}</option>))}
                        </select>
                        <input type="time" className="w-24 p-2 text-xs sm:text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" value={newPermTime} onChange={e => setNewPermTime(e.target.value)} required />
                      </div>
                      <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded text-xs sm:text-sm font-medium transition-colors flex justify-center items-center">
                        <Plus className="w-4 h-4 mr-1" /> Adicionar
                      </button>
                    </form>
                    
                    <div className="space-y-4">
                      {daysOfWeek.map((dayName, dayIndex) => {
                        const dayActivities = permanentActivities.filter(a => a.dayOfWeek === dayIndex).sort((a, b) => a.time.localeCompare(b.time));
                        if (dayActivities.length === 0) return null;
                        return (
                          <div key={dayIndex} className="mb-3 sm:mb-4">
                            <h3 className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 sm:mb-2">{dayName}</h3>
                            <div className="space-y-1.5 sm:space-y-2">
                              {dayActivities.map(act => (
                                <div key={act.id} className="flex justify-between items-start bg-white p-2 rounded border border-slate-100 shadow-sm group">
                                  <div>
                                    <p className="text-xs sm:text-sm font-medium text-slate-700">{act.title}</p>
                                    <p className="text-[10px] sm:text-xs text-slate-500 flex items-center mt-0.5 sm:mt-1"><Clock className="w-3 h-3 mr-1" /> {act.time}</p>
                                  </div>
                                  <button onClick={() => handleDelete(act.id, 'permanent')} className="text-slate-300 hover:text-red-500 md:opacity-0 group-hover:opacity-100 transition-opacity p-1"><Trash2 className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Grade do Calendário */}
                <div className="flex-1 flex flex-col relative w-full overflow-hidden">
                  <header className="bg-white border-b border-slate-200 p-2 sm:p-4 flex items-center justify-between shrink-0 min-h-[3.5rem] sm:min-h-[4rem]">
                    <div className="flex items-center">
                      <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1.5 sm:p-2 mr-2 sm:mr-4 text-slate-500 hover:bg-slate-100 rounded-md transition-colors"><Menu className="w-5 h-5 sm:w-6 sm:h-6" /></button>
                      <h1 className="text-base sm:text-xl font-bold text-slate-800 whitespace-nowrap">{monthNames[month]} <span className="hidden sm:inline">{year}</span><span className="sm:hidden"> '{String(year).slice(2)}</span></h1>
                    </div>
                    <div className="flex items-center space-x-1 sm:space-x-2">
                      <button onClick={prevMonth} className="p-1 sm:p-2 hover:bg-slate-100 rounded-full transition-colors"><ChevronLeft className="w-5 h-5 text-slate-600" /></button>
                      <button onClick={() => setCurrentDate(new Date())} className="px-2 sm:px-3 py-1 text-xs sm:text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition-colors">Hoje</button>
                      <button onClick={nextMonth} className="p-1 sm:p-2 hover:bg-slate-100 rounded-full transition-colors"><ChevronRight className="w-5 h-5 text-slate-600" /></button>
                    </div>
                  </header>

                  <div className="flex-1 overflow-auto bg-slate-200 p-px flex flex-col hide-scrollbar">
                    <div className="grid grid-cols-7 gap-px mb-px bg-slate-200 shrink-0">
                      {daysOfWeekShort.map(day => (<div key={day} className="bg-slate-50 py-1.5 sm:py-2 text-center text-[10px] sm:text-xs font-semibold text-slate-500 tracking-wide">{day}</div>))}
                    </div>
                    <div className="grid grid-cols-7 gap-px bg-slate-200 flex-1 min-h-max">
                      {Array.from({ length: firstDay }).map((_, i) => (<div key={`empty-${i}`} className="bg-slate-50/50 min-h-[80px] sm:min-h-[120px]" />))}
                      {Array.from({ length: daysCount }).map((_, i) => {
                        const dayNum = i + 1;
                        const dateString = formatDateString(year, month, dayNum);
                        const dayOfWeek = new Date(year, month, dayNum).getDay();
                        const isToday = formatDateString(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()) === dateString;
                        const dayPerms = permanentActivities.filter(a => a.dayOfWeek === dayOfWeek).sort((a, b) => a.time.localeCompare(b.time));
                        
                        const dayVars = variableTasks.filter(t => {
                          const endD = t.endDate || t.date;
                          return dateString >= t.date && dateString <= endD;
                        }).sort((a, b) => (a.time || "24:00").localeCompare(b.time || "24:00"));

                        return (
                          <div key={dayNum} onClick={() => { setSelectedDay({ dayNum, dateString, dayOfWeek, dayPerms, dayVars }); setModalTab('view'); }} className={`bg-white min-h-[80px] sm:min-h-[120px] p-1 sm:p-2 hover:bg-indigo-50/30 cursor-pointer transition-colors relative group ${isToday ? 'ring-2 ring-indigo-500 ring-inset z-10' : ''}`}>
                            <div className="flex justify-between items-start mb-0.5 sm:mb-1">
                              <span className={`text-[10px] sm:text-sm font-medium w-5 h-5 sm:w-7 sm:h-7 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : 'text-slate-700'}`}>{dayNum}</span>
                              <button className="hidden sm:block opacity-0 group-hover:opacity-100 text-indigo-400 hover:text-indigo-600 transition-opacity"><Plus className="w-4 h-4" /></button>
                            </div>
                            <div className="space-y-0.5 sm:space-y-1 overflow-y-auto max-h-[calc(100%-1.5rem)] sm:max-h-[calc(100%-2rem)] hide-scrollbar">
                              {dayPerms.map(act => (
                                <div key={act.id} className="text-[9px] sm:text-xs px-1 sm:px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded border border-indigo-100 truncate flex items-center"><Repeat className="w-2.5 h-2.5 sm:w-3 sm:h-3 mr-0.5 sm:mr-1 shrink-0 opacity-50" /><span className="font-semibold mr-1 hidden sm:inline">{act.time}</span> {act.title}</div>
                              ))}
                              {dayVars.map(task => (
                                <div key={task.id} className="text-[9px] sm:text-xs px-1 sm:px-1.5 py-0.5 bg-amber-50 text-amber-800 rounded border border-amber-100 truncate flex items-center">{task.time && <span className="font-semibold mr-1 hidden sm:inline">{task.time}</span>} {task.title}</div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                              <div>
                                <label className="block text-[10px] sm:text-xs font-semibold text-yellow-800 uppercase tracking-wide mb-1">Comissionado:</label>
                                <input type="text" className="w-full p-2 text-xs sm:text-sm border border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 bg-white" value={clientForm.commissionTo} onChange={e => setClientForm({...clientForm, commissionTo: e.target.value})} placeholder="Nome" />
                              </div>
                              <div>
                                <label className="block text-[10px] sm:text-xs font-semibold text-yellow-800 uppercase tracking-wide mb-1">Chave PIX:</label>
                                <input type="text" className="w-full p-2 text-xs sm:text-sm border border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 bg-white" value={clientForm.commissionPix} onChange={e => setClientForm({...clientForm, commissionPix: e.target.value})} placeholder="CPF/Telefone" />
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Logística */}
                      <div>
                        <label className="block text-[10px] sm:text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Local / Formato</label>
                        <input type="text" className="w-full p-2.5 text-xs sm:text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.location} onChange={e => setClientForm({...clientForm, location: e.target.value})} placeholder="Ex: São Paulo ou Online" />
                      </div>
                      
                      <div>
                        <label className="block text-[10px] sm:text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Responsável Interno</label>
                        <input type="text" className="w-full p-2.5 text-xs sm:text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.responsible} onChange={e => setClientForm({...clientForm, responsible: e.target.value})} />
                      </div>
                      
                      <div>
                        <label className="block text-[10px] sm:text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Contato do Cliente</label>
                        <input type="text" className="w-full p-2.5 text-xs sm:text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.contact} onChange={e => setClientForm({...clientForm, contact: e.target.value})} />
                      </div>
                      
                      <div className="flex items-center pt-2 md:pt-6">
                        <label className="flex items-center cursor-pointer group">
                          <input type="checkbox" className="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer" checked={clientForm.requiresTravel} onChange={e => setClientForm({...clientForm, requiresTravel: e.target.checked})} />
                          <span className="ml-2 text-xs sm:text-sm font-medium text-slate-700">Necessita de Viagem?</span>
                        </label>
                      </div>
                      
                      <div className="col-span-1 md:col-span-2">
                        <label className="block text-[10px] sm:text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Observações</label>
                        <textarea rows="2" className="w-full p-2.5 text-xs sm:text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" value={clientForm.notes} onChange={e => setClientForm({...clientForm, notes: e.target.value})} />
                      </div>
                    </div>

                    <div className="mt-6 sm:mt-8 pt-4 border-t border-slate-100 flex flex-col-reverse sm:flex-row justify-end gap-2 sm:gap-3">
                      <button type="button" onClick={() => setIsClientModalOpen(false)} className="w-full sm:w-auto px-5 py-2.5 text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancelar</button>
                      <button type="submit" className="w-full sm:w-auto justify-center px-5 py-2.5 text-xs sm:text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors flex items-center shadow-sm">
                        <CheckCircle2 className="w-4 h-4 mr-2" /> Salvar Cliente
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<PlannerApp />);
  </script>
</body>
</html>
