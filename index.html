<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agência Planner</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos customizados (esconder barra de rolagem) -->
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Import Map: Define onde o navegador vai buscar as bibliotecas -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>

  <!-- Babel: Compila o JSX para Javascript puro em tempo real no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- A div onde o React vai injetar o App -->
  <div id="root"></div>

  <!-- O script principal do App. O atributo type="text/babel" data-type="module" é essencial aqui. -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { ChevronLeft, ChevronRight, Plus, Trash2, Calendar as CalendarIcon, Clock, Repeat, AlertCircle, X, Users, Briefcase, MapPin, DollarSign, Plane, User, Phone, Edit2, LayoutDashboard } from 'lucide-react';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc } from 'firebase/firestore';

    // === CONFIGURAÇÃO DO SEU FIREBASE ===
    // Chaves reais do projeto pluss-planner inseridas:
    const myCustomFirebaseConfig = {
      apiKey: "AIzaSyCi6WmRrPBt9_5hRJsegqERHkzytqhM0hI",
      authDomain: "pluss-planner.firebaseapp.com",
      projectId: "pluss-planner",
      storageBucket: "pluss-planner.firebasestorage.app",
      messagingSenderId: "1017621824035",
      appId: "1:1017621824035:web:eabb474b2df676cd04a796"
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'agencia-planner-app';
    let app, auth, db;

    try {
      const firebaseConfig = myCustomFirebaseConfig || (typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : { projectId: 'mock-project' });
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.error("Erro ao inicializar Firebase:", e);
    }

    function PlannerApp() {
      // Estado Data/Calendário
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDay, setSelectedDay] = useState(null);
      
      // Estado Navegação
      const [activeTab, setActiveTab] = useState('calendar');

      // Estado Clientes
      const [clients, setClients] = useState([]);
      const [isClientModalOpen, setIsClientModalOpen] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      const initialClientState = {
        name: '', type: 'EM PROSPECÇÃO', service: '', value: '', deadline: '',
        location: '', requiresTravel: false, responsible: '', status: 'Ativo',
        contact: '', notes: ''
      };
      const [clientForm, setClientForm] = useState(initialClientState);

      // Estado Banco de Dados e UI
      const [user, setUser] = useState(null);
      const [permanentActivities, setPermanentActivities] = useState([]);
      const [variableTasks, setVariableTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [errorMsg, setErrorMsg] = useState("");
      
      // Estado Formulários Tarefas
      const [newPermTitle, setNewPermTitle] = useState("");
      const [newPermDay, setNewPermDay] = useState("1");
      const [newPermTime, setNewPermTime] = useState("");
      const [newVarTitle, setNewVarTitle] = useState("");
      const [newVarTime, setNewVarTime] = useState("");
      const [newVarDuration, setNewVarDuration] = useState("1");
      const [modalTab, setModalTab] = useState('view');

      const daysOfWeek = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

      useEffect(() => {
        if (!auth) return;
        const authenticate = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined') {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Auth error:", err);
            // Mostra o erro exato do Firebase na tela para facilitar a correção
            setErrorMsg(`Erro de Auth: ${err.code || err.message}. Verifique domínios e se o Anônimo está ativo.`);
          }
        };

        authenticate();
        const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });

        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!user || !db) return;
        setLoading(true);

        const permRef = collection(db, 'artifacts', appId, 'users', user.uid, 'permanent_activities');
        const varRef = collection(db, 'artifacts', appId, 'users', user.uid, 'variable_tasks');
        const clientRef = collection(db, 'artifacts', appId, 'users', user.uid, 'clients');

        const unsubPerm = onSnapshot(permRef, (snapshot) => {
          const perms = [];
          snapshot.forEach(doc => perms.push({ id: doc.id, ...doc.data() }));
          setPermanentActivities(perms);
        }, (err) => console.error(err));

        const unsubVar = onSnapshot(varRef, (snapshot) => {
          const vars = [];
          snapshot.forEach(doc => vars.push({ id: doc.id, ...doc.data() }));
          setVariableTasks(vars);
          setLoading(false);
        }, (err) => console.error(err));

        const unsubClients = onSnapshot(clientRef, (snapshot) => {
          const cls = [];
          snapshot.forEach(doc => cls.push({ id: doc.id, ...doc.data() }));
          setClients(cls);
        }, (err) => console.error(err));

        return () => { unsubPerm(); unsubVar(); unsubClients(); };
      }, [user]);

      const handleAddPermanent = async (e) => {
        e.preventDefault();
        if (!newPermTitle || !newPermTime || !user) return;
        try {
          const permRef = collection(db, 'artifacts', appId, 'users', user.uid, 'permanent_activities');
          await addDoc(permRef, { title: newPermTitle, dayOfWeek: parseInt(newPermDay), time: newPermTime, createdAt: new Date().toISOString() });
          setNewPermTitle(""); setNewPermTime("");
        } catch (err) { setErrorMsg("Erro ao salvar atividade permanente."); }
      };

      const handleAddVariable = async (e, dateString) => {
        e.preventDefault();
        if (!newVarTitle || !user) return;
        try {
          // Calcula a data de término baseada na duração em dias
          const start = new Date(dateString + 'T12:00:00');
          const end = new Date(start);
          end.setDate(end.getDate() + parseInt(newVarDuration || 1) - 1);
          const endDateString = formatDateString(end.getFullYear(), end.getMonth(), end.getDate());

          const varRef = collection(db, 'artifacts', appId, 'users', user.uid, 'variable_tasks');
          await addDoc(varRef, { 
            title: newVarTitle, 
            date: dateString, 
            endDate: endDateString,
            duration: parseInt(newVarDuration || 1),
            time: newVarTime || null, 
            createdAt: new Date().toISOString() 
          });
          
          setNewVarTitle(""); setNewVarTime(""); setNewVarDuration("1");
          setModalTab('view'); // Volta para a aba de visualização após salvar
        } catch (err) { setErrorMsg("Erro ao salvar tarefa variável."); }
      };

      const handleDelete = async (id, type) => {
        if (!user) return;
        try {
          const collectionName = type === 'permanent' ? 'permanent_activities' : 'variable_tasks';
          await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, collectionName, id));
        } catch (err) { setErrorMsg("Erro ao excluir item."); }
      };

      const handleSaveClient = async (e) => {
        e.preventDefault();
        if (!user) return setErrorMsg("Usuário não autenticado.");
        if (!clientForm.name) return setErrorMsg("O nome é obrigatório.");
        try {
          if (editingClient) {
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'clients', editingClient.id), { ...clientForm, updatedAt: new Date().toISOString() });
          } else {
            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'clients'), { ...clientForm, createdAt: new Date().toISOString() });
          }
          setIsClientModalOpen(false); setEditingClient(null); setClientForm(initialClientState);
        } catch (err) { setErrorMsg("Erro ao salvar cliente."); }
      };

      const openEditClient = (client) => { setEditingClient(client); setClientForm({ ...client }); setIsClientModalOpen(true); };
      const handleDeleteClient = async (id) => { if (user) await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'clients', id)); };

      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();
      const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));

      const year = currentDate.getFullYear(); const month = currentDate.getMonth();
      const daysCount = getDaysInMonth(year, month); const firstDay = getFirstDayOfMonth(year, month);
      const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const formatDateString = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* Header */}
          <header className="bg-slate-900 text-white flex items-center justify-between px-4 py-3 shrink-0 z-20 shadow-md">
            <div className="flex items-center space-x-6">
              <h1 className="font-bold text-xl tracking-tight flex items-center">
                <LayoutDashboard className="w-5 h-5 mr-2 text-indigo-400" /> AgênciaPlanner
              </h1>
              <nav className="flex space-x-2 bg-slate-800/50 p-1 rounded-lg">
                <button onClick={() => setActiveTab('calendar')} className={`flex items-center px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${activeTab === 'calendar' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}>
                  <CalendarIcon className="w-4 h-4 mr-2" /> Calendário
                </button>
                <button onClick={() => setActiveTab('clients')} className={`flex items-center px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${activeTab === 'clients' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}>
                  <Users className="w-4 h-4 mr-2" /> Clientes
                </button>
              </nav>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden relative">
            
            {/* ABA CALENDÁRIO */}
            {activeTab === 'calendar' && (
              <>
                <div className={`${isSidebarOpen ? 'w-80' : 'w-0'} transition-all duration-300 bg-white border-r border-slate-200 overflow-hidden flex flex-col shadow-sm z-10`}>
                  <div className="p-4 border-b border-slate-100 bg-slate-50">
                    <h2 className="font-bold text-slate-800 flex items-center"><Repeat className="w-4 h-4 mr-2 text-indigo-500" /> Atividades Fixas</h2>
                  </div>
                  <div className="p-4 flex-1 overflow-y-auto">
                    <form onSubmit={handleAddPermanent} className="mb-6 bg-indigo-50/50 p-3 rounded-lg border border-indigo-100">
                      <input type="text" placeholder="Ex: Reunião de Pauta" className="w-full p-2 mb-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" value={newPermTitle} onChange={e => setNewPermTitle(e.target.value)} required />
                      <div className="flex gap-2 mb-2">
                        <select className="flex-1 p-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white" value={newPermDay} onChange={e => setNewPermDay(e.target.value)}>
                          {daysOfWeek.map((day, idx) => (<option key={idx} value={idx}>{day}</option>))}
                        </select>
                        <input type="time" className="w-24 p-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" value={newPermTime} onChange={e => setNewPermTime(e.target.value)} required />
                      </div>
                      <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded text-sm font-medium transition-colors flex justify-center items-center">
                        <Plus className="w-4 h-4 mr-1" /> Adicionar Fixo
                      </button>
                    </form>
                    <div className="space-y-4">
                      {daysOfWeek.map((dayName, dayIndex) => {
                        const dayActivities = permanentActivities.filter(a => a.dayOfWeek === dayIndex).sort((a, b) => a.time.localeCompare(b.time));
                        if (dayActivities.length === 0) return null;
                        return (
                          <div key={dayIndex} className="mb-4">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{dayName}</h3>
                            <div className="space-y-2">
                              {dayActivities.map(act => (
                                <div key={act.id} className="flex justify-between items-start bg-white p-2 rounded border border-slate-100 shadow-sm group">
                                  <div>
                                    <p className="text-sm font-medium text-slate-700">{act.title}</p>
                                    <p className="text-xs text-slate-500 flex items-center mt-1"><Clock className="w-3 h-3 mr-1" /> {act.time}</p>
                                  </div>
                                  <button onClick={() => handleDelete(act.id, 'permanent')} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 className="w-4 h-4" /></button>
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="flex-1 flex flex-col relative">
                  {errorMsg && (
                    <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 absolute top-4 right-4 z-50 rounded shadow-md flex items-center justify-between">
                      <div className="flex items-center"><AlertCircle className="w-5 h-5 mr-2"/> {errorMsg}</div>
                      <button onClick={() => setErrorMsg("")}><X className="w-4 h-4 ml-4 hover:text-red-900"/></button>
                    </div>
                  )}

                  <header className="bg-white border-b border-slate-200 p-4 flex items-center justify-between h-16">
                    <div className="flex items-center">
                      <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 mr-4 text-slate-500 hover:bg-slate-100 rounded-md transition-colors"><CalendarIcon className="w-5 h-5" /></button>
                      <h1 className="text-xl font-bold text-slate-800">{monthNames[month]} {year}</h1>
                    </div>
                    <div className="flex items-center space-x-2">
                      <button onClick={prevMonth} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><ChevronLeft className="w-5 h-5 text-slate-600" /></button>
                      <button onClick={() => setCurrentDate(new Date())} className="px-3 py-1 text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition-colors">Hoje</button>
                      <button onClick={nextMonth} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><ChevronRight className="w-5 h-5 text-slate-600" /></button>
                    </div>
                  </header>

                  <div className="flex-1 overflow-auto bg-slate-200 p-px flex flex-col">
                    <div className="grid grid-cols-7 gap-px mb-px bg-slate-200 shrink-0">
                      {daysOfWeek.map(day => (<div key={day} className="bg-slate-50 py-2 text-center text-xs font-semibold text-slate-500 uppercase tracking-wide">{day.substring(0, 3)}</div>))}
                    </div>
                    <div className="grid grid-cols-7 gap-px bg-slate-200 flex-1">
                      {Array.from({ length: firstDay }).map((_, i) => (<div key={`empty-${i}`} className="bg-slate-50/50 min-h-[100px]" />))}
                      {Array.from({ length: daysCount }).map((_, i) => {
                        const dayNum = i + 1;
                        const dateString = formatDateString(year, month, dayNum);
                        const dayOfWeek = new Date(year, month, dayNum).getDay();
                        const isToday = formatDateString(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()) === dateString;
                        const dayPerms = permanentActivities.filter(a => a.dayOfWeek === dayOfWeek).sort((a, b) => a.time.localeCompare(b.time));
                        
                        // Atualizado para exibir tarefas que cruzam múltiplos dias
                        const dayVars = variableTasks.filter(t => {
                          const endD = t.endDate || t.date;
                          return dateString >= t.date && dateString <= endD;
                        }).sort((a, b) => (a.time || "24:00").localeCompare(b.time || "24:00"));

                        return (
                          <div key={dayNum} onClick={() => { setSelectedDay({ dayNum, dateString, dayOfWeek, dayPerms, dayVars }); setModalTab('view'); }} className={`bg-white min-h-[120px] p-2 hover:bg-indigo-50/30 cursor-pointer transition-colors relative group ${isToday ? 'ring-2 ring-indigo-500 ring-inset z-10' : ''}`}>
                            <div className="flex justify-between items-start mb-1">
                              <span className={`text-sm font-medium w-7 h-7 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : 'text-slate-700'}`}>{dayNum}</span>
                              <button className="opacity-0 group-hover:opacity-100 text-indigo-400 hover:text-indigo-600 transition-opacity"><Plus className="w-4 h-4" /></button>
                            </div>
                            <div className="space-y-1 overflow-y-auto max-h-[calc(100%-2rem)] hide-scrollbar">
                              {dayPerms.map(act => (
                                <div key={act.id} className="text-xs px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded border border-indigo-100 truncate flex items-center"><Repeat className="w-3 h-3 mr-1 shrink-0 opacity-50" /><span className="font-semibold mr-1">{act.time}</span> {act.title}</div>
                              ))}
                              {dayVars.map(task => (
                                <div key={task.id} className="text-xs px-1.5 py-0.5 bg-amber-50 text-amber-800 rounded border border-amber-100 truncate flex items-center">{task.time && <span className="font-semibold mr-1">{task.time}</span>} {task.title}</div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {selectedDay && (
                    <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                      <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50">
                          <h3 className="font-bold text-lg text-slate-800">{selectedDay.dayNum} de {monthNames[month]} ({daysOfWeek[selectedDay.dayOfWeek]})</h3>
                          <button onClick={() => setSelectedDay(null)} className="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-full hover:bg-slate-200"><X className="w-5 h-5" /></button>
                        </div>
                        
                        {/* Novas Abas do Modal */}
                        <div className="flex border-b border-slate-200 bg-slate-50 shrink-0">
                          <button onClick={() => setModalTab('view')} className={`flex-1 py-3 text-sm font-semibold transition-colors ${modalTab === 'view' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}>Ver Tarefas</button>
                          <button onClick={() => setModalTab('add')} className={`flex-1 py-3 text-sm font-semibold transition-colors ${modalTab === 'add' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}>Adicionar Tarefa</button>
                        </div>

                        <div className="p-4 overflow-y-auto flex-1">
                          {modalTab === 'add' ? (
                            <form onSubmit={(e) => { handleAddVariable(e, selectedDay.dateString); }} className="bg-amber-50/50 p-4 rounded-lg border border-amber-100">
                              <h4 className="text-sm font-semibold text-amber-800 mb-3">Nova Tarefa para {selectedDay.dayNum} de {monthNames[month]}</h4>
                              <input type="text" placeholder="Ex: Viagem de Negócios, Reunião..." className="w-full p-2.5 mb-3 text-sm border border-amber-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white shadow-sm" value={newVarTitle} onChange={e => setNewVarTitle(e.target.value)} required />
                              
                              <div className="grid grid-cols-2 gap-3 mb-4">
                                <div>
                                  <label className="block text-xs font-semibold text-amber-700 mb-1">Horário (Opcional)</label>
                                  <input type="time" className="w-full p-2.5 text-sm border border-amber-200 rounded-lg bg-white shadow-sm" value={newVarTime} onChange={e => setNewVarTime(e.target.value)} />
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-amber-700 mb-1">Duração (Dias)</label>
                                  <input type="number" min="1" className="w-full p-2.5 text-sm border border-amber-200 rounded-lg bg-white shadow-sm" value={newVarDuration} onChange={e => setNewVarDuration(e.target.value)} required />
                                </div>
                              </div>
                              
                              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-white p-2.5 rounded-lg text-sm font-semibold transition-colors flex justify-center items-center shadow-sm"><Plus className="w-4 h-4 mr-2" /> Salvar Tarefa</button>
                            </form>
                          ) : (
                            <div className="space-y-4">
                              {selectedDay.dayPerms.length > 0 && (
                                <div>
                                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center"><Repeat className="w-3 h-3 mr-1" /> Fixas de hoje</h4>
                                  <div className="space-y-2">{selectedDay.dayPerms.map(act => (<div key={act.id} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100"><span className="text-sm text-slate-700 font-medium">{act.title}</span><span className="text-xs font-semibold text-slate-600 bg-slate-200 px-2 py-1 rounded-md">{act.time}</span></div>))}</div>
                                </div>
                              )}
                              
                              {variableTasks.filter(t => selectedDay.dateString >= t.date && selectedDay.dateString <= (t.endDate || t.date)).length > 0 && (
                                <div>
                                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 mt-5">Tarefas Deste Dia</h4>
                                  <div className="space-y-2">
                                    {variableTasks.filter(t => selectedDay.dateString >= t.date && selectedDay.dateString <= (t.endDate || t.date)).sort((a,b) => (a.time||"24").localeCompare(b.time||"24")).map(task => {
                                      const isMultiDay = task.duration && task.duration > 1;
                                      return (
                                        <div key={task.id} className="flex justify-between items-center bg-white p-3 rounded-lg border border-amber-200 shadow-sm group">
                                          <div className="flex flex-col">
                                            <span className="text-sm text-slate-800 font-medium">{task.title}</span>
                                            <div className="flex items-center gap-2 mt-1">
                                              {task.time && <span className="text-xs font-semibold text-amber-600 flex items-center"><Clock className="w-3 h-3 mr-1" /> {task.time}</span>}
                                              {isMultiDay && <span className="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded flex items-center">Duração: {task.duration} dias</span>}
                                            </div>
                                          </div>
                                          <button onClick={() => handleDelete(task.id, 'variable')} className="text-slate-300 hover:text-red-500 transition-colors p-1.5 bg-slate-50 hover:bg-red-50 rounded-md" title="Excluir"><Trash2 className="w-4 h-4" /></button>
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              )}
                              
                              {selectedDay.dayPerms.length === 0 && variableTasks.filter(t => selectedDay.dateString >= t.date && selectedDay.dateString <= (t.endDate || t.date)).length === 0 && (
                                <div className="text-center py-8">
                                  <p className="text-sm text-slate-400 font-medium">Nenhuma tarefa para este dia.</p>
                                  <button onClick={() => setModalTab('add')} className="text-indigo-600 text-sm font-semibold mt-2 hover:underline">Adicionar a primeira tarefa</button>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </>
            )}

            {/* ABA CLIENTES */}
            {activeTab === 'clients' && (
              <div className="flex-1 flex flex-col relative bg-slate-50 overflow-hidden w-full">
                {errorMsg && (
                  <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 absolute top-4 right-4 z-50 rounded shadow-md flex items-center justify-between">
                    <div className="flex items-center"><AlertCircle className="w-5 h-5 mr-2"/> {errorMsg}</div>
                    <button onClick={() => setErrorMsg("")}><X className="w-4 h-4 ml-4 hover:text-red-900"/></button>
                  </div>
                )}

                <header className="bg-white border-b border-slate-200 p-4 flex items-center justify-between h-16 shrink-0">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center">Gestão de Clientes e Prospecções</h2>
                  <button onClick={() => { setEditingClient(null); setClientForm(initialClientState); setIsClientModalOpen(true); }} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors flex items-center shadow-sm">
                    <Plus className="w-4 h-4 mr-2" /> Novo Cliente
                  </button>
                </header>

                <div className="flex-1 p-6 overflow-x-auto overflow-y-hidden">
                  <div className="flex gap-6 h-full min-w-max">
                    {['EM PROSPECÇÃO', 'PONTUAL', 'PERIÓDICO'].map(tipo => {
                      const columnClients = clients.filter(c => c.type === tipo);
                      let colConfig = { color: 'bg-slate-100', border: 'border-slate-200', text: 'text-slate-700' };
                      if (tipo === 'EM PROSPECÇÃO') colConfig = { color: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-800' };
                      if (tipo === 'PONTUAL') colConfig = { color: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-800' };
                      if (tipo === 'PERIÓDICO') colConfig = { color: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-800' };

                      return (
                        <div key={tipo} className={`w-80 sm:w-96 flex flex-col rounded-xl border ${colConfig.border} ${colConfig.color} overflow-hidden shadow-sm h-full max-h-full`}>
                          <div className="p-3 border-b border-white/40 flex justify-between items-center bg-white/40">
                            <h3 className={`font-bold text-sm tracking-wide ${colConfig.text}`}>{tipo}</h3>
                            <span className="text-xs font-semibold px-2 py-1 bg-white rounded-full text-slate-600 shadow-sm">{columnClients.length}</span>
                          </div>
                          <div className="p-3 flex-1 overflow-y-auto space-y-3 hide-scrollbar">
                            {columnClients.map(client => (
                              <div key={client.id} className="bg-white p-4 rounded-lg shadow-sm border border-slate-100 hover:shadow-md transition-shadow group relative">
                                <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity flex space-x-1">
                                  <button onClick={() => openEditClient(client)} className="p-1.5 text-slate-400 hover:text-indigo-600 bg-slate-50 hover:bg-indigo-50 rounded-md transition-colors" title="Editar"><Edit2 className="w-3.5 h-3.5" /></button>
                                  <button onClick={() => handleDeleteClient(client.id)} className="p-1.5 text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50 rounded-md transition-colors" title="Excluir"><Trash2 className="w-3.5 h-3.5" /></button>
                                </div>
                                <h4 className="font-bold text-slate-800 mb-1 pr-16 leading-tight">{client.name}</h4>
                                <div className="text-xs text-slate-500 mb-3 space-y-1.5 mt-2">
                                  <div className="flex items-start"><Briefcase className="w-3.5 h-3.5 mr-1.5 mt-0.5 shrink-0 text-slate-400" /> <span className="line-clamp-2">{client.service || 'Serviço não detalhado'}</span></div>
                                  {client.responsible && <div className="flex items-center"><User className="w-3.5 h-3.5 mr-1.5 shrink-0 text-slate-400" /> {client.responsible}</div>}
                                  {client.location && <div className="flex items-center"><MapPin className="w-3.5 h-3.5 mr-1.5 shrink-0 text-slate-400" /> {client.location}</div>}
                                  {client.contact && <div className="flex items-center"><Phone className="w-3.5 h-3.5 mr-1.5 shrink-0 text-slate-400" /> {client.contact}</div>}
                                </div>
                                <div className="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-slate-50">
                                  {client.value && <span className="inline-flex items-center text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700"><DollarSign className="w-3 h-3 mr-0.5"/> {client.value}</span>}
                                  {client.deadline && <span className="inline-flex items-center text-[10px] font-semibold px-1.5 py-0.5 rounded bg-orange-100 text-orange-700"><CalendarIcon className="w-3 h-3 mr-0.5"/> {client.deadline}</span>}
                                  {client.requiresTravel && <span className="inline-flex items-center text-[10px] font-semibold px-1.5 py-0.5 rounded bg-purple-100 text-purple-700"><Plane className="w-3 h-3 mr-0.5"/> Viagem Necessária</span>}
                                  {client.status && <span className="inline-flex items-center text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">{client.status}</span>}
                                </div>
                              </div>
                            ))}
                            {columnClients.length === 0 && (<div className="h-24 flex items-center justify-center text-sm text-slate-400/70 italic border-2 border-dashed border-white/50 rounded-lg">Nenhum cliente nesta etapa</div>)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* Modal Novo/Editar Cliente */}
            {isClientModalOpen && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[95vh]">
                  <div className="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50">
                    <h3 className="font-bold text-lg text-slate-800">{editingClient ? 'Editar Cliente' : 'Novo Cliente'}</h3>
                    <button onClick={() => setIsClientModalOpen(false)} className="text-slate-400 hover:text-slate-600 transition-colors p-1.5 rounded-full hover:bg-slate-200"><X className="w-5 h-5" /></button>
                  </div>
                  <form onSubmit={handleSaveClient} className="overflow-y-auto p-6 flex-1 bg-white">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div className="col-span-1 md:col-span-2">
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Nome do Cliente / Empresa *</label>
                        <input type="text" required className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.name} onChange={e => setClientForm({...clientForm, name: e.target.value})} placeholder="Ex: Acme Corp" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Tipo de Cliente</label>
                        <select className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white" value={clientForm.type} onChange={e => setClientForm({...clientForm, type: e.target.value})}>
                          <option value="EM PROSPECÇÃO">Em Prospecção</option><option value="PONTUAL">Pontual</option><option value="PERIÓDICO">Periódico</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Status</label>
                        <input type="text" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.status} onChange={e => setClientForm({...clientForm, status: e.target.value})} placeholder="Ex: Ativo, Negociando..." />
                      </div>
                      <div className="col-span-1 md:col-span-2">
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Serviço que será prestado</label>
                        <textarea rows="2" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" value={clientForm.service} onChange={e => setClientForm({...clientForm, service: e.target.value})} placeholder="Descreva os serviços..." />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Valor / Orçamento Estimado</label>
                        <input type="text" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.value} onChange={e => setClientForm({...clientForm, value: e.target.value})} placeholder="Ex: R$ 5.000,00" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Prazo / Recorrência</label>
                        <input type="text" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.deadline} onChange={e => setClientForm({...clientForm, deadline: e.target.value})} placeholder="Ex: 30 dias" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Local / Formato</label>
                        <input type="text" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.location} onChange={e => setClientForm({...clientForm, location: e.target.value})} placeholder="Ex: São Paulo, SP ou Online" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Responsável (Agência)</label>
                        <input type="text" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.responsible} onChange={e => setClientForm({...clientForm, responsible: e.target.value})} placeholder="Nome do consultor" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Contato (Cliente)</label>
                        <input type="text" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value={clientForm.contact} onChange={e => setClientForm({...clientForm, contact: e.target.value})} placeholder="Email, Telefone..." />
                      </div>
                      <div className="flex items-center pt-6">
                        <label className="flex items-center cursor-pointer group">
                          <input type="checkbox" className="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer" checked={clientForm.requiresTravel} onChange={e => setClientForm({...clientForm, requiresTravel: e.target.checked})} />
                          <span className="ml-2 text-sm font-medium text-slate-700 group-hover:text-indigo-700 transition-colors">Necessita de Viagem?</span>
                        </label>
                      </div>
                      <div className="col-span-1 md:col-span-2">
                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Observações Gerais</label>
                        <textarea rows="2" className="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" value={clientForm.notes} onChange={e => setClientForm({...clientForm, notes: e.target.value})} placeholder="Anotações extras..." />
                      </div>
                    </div>
                    <div className="mt-8 pt-4 border-t border-slate-100 flex justify-end gap-3">
                      <button type="button" onClick={() => setIsClientModalOpen(false)} className="px-5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancelar</button>
                      <button type="submit" className="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors flex items-center shadow-sm">
                        <Plus className="w-4 h-4 mr-2" /> {editingClient ? 'Atualizar Cliente' : 'Salvar Cliente'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<PlannerApp />);
  </script>
</body>
</html>
